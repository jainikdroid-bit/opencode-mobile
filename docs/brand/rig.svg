<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="480" height="480" role="img" aria-label="RIG, the cyberpunk worker mascot">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16384a"/>
      <stop offset="1" stop-color="#0c1a26"/>
    </linearGradient>
  </defs>
  <!-- antenna -->
  <line x1="88" y1="38" x2="99" y2="21" stroke="#1c2333" stroke-width="3" stroke-linecap="round"/>
  <circle cx="99" cy="19" r="3.4" fill="#ff3df0" filter="url(#glow)"/>
  <!-- body -->
  <path d="M30 118 L30 101 Q30 94 38 93 L82 93 Q90 94 90 101 L90 118 Z" fill="#0d1018" stroke="#1c2333" stroke-width="2"/>
  <rect x="44" y="102" width="32" height="3" rx="1.5" fill="#1c2333"/>
  <circle cx="60" cy="110" r="3" fill="#ff3df0" filter="url(#glow)"/>
  <!-- head -->
  <rect x="28" y="50" width="64" height="44" rx="12" fill="#0d1018" stroke="#1c2333" stroke-width="2"/>
  <!-- headset -->
  <rect x="21" y="62" width="8" height="18" rx="4" fill="#0891b2"/>
  <rect x="91" y="62" width="8" height="18" rx="4" fill="#0891b2"/>
  <!-- visor -->
  <rect x="35" y="59" width="50" height="20" rx="10" fill="#06141b" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
  <rect x="41" y="65" width="20" height="8" rx="4" fill="#22d3ee" filter="url(#glow)"/>
  <rect x="66" y="65" width="12" height="8" rx="4" fill="#0891b2" opacity=".55"/>
  <!-- vent -->
  <rect x="48" y="85" width="24" height="2" rx="1" fill="#8a93a8" opacity=".55"/>
  <rect x="52" y="89" width="16" height="2" rx="1" fill="#8a93a8" opacity=".35"/>
  <!-- hard hat -->
  <path d="M26 54 Q26 20 60 20 Q94 20 94 54 Z" fill="url(#hat)" stroke="#22d3ee" stroke-width="2"/>
  <rect x="53" y="20" width="14" height="34" fill="#ff3df0" opacity=".9"/>
  <rect x="19" y="52" width="82" height="7" rx="3.5" fill="#0891b2" stroke="#22d3ee" stroke-width="1.5"/>
</svg>
